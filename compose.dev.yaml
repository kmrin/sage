# Dev overlay: publishes the db, lavalink and searxng on localhost so sage can run with `uv run`
#   docker compose -f compose.yaml -f compose.dev.yaml up -d sage-db sage-lavalink sage-searxng
#   POSTGRES_HOST=127.0.0.1 ; LAVALINK_HOST=127.0.0.1 ; SEARXNG_URL=http://127.0.0.1:8888 on .env
services:
  sage-db:
    ports:
      - "127.0.0.1:5432:5432"
  
  sage-lavalink:
    ports:
      - "127.0.0.1:2333:2333"

  sage-searxng:
    ports:
      - "127.0.0.1:8888:8080"

networks:
  sage-backend:
    internal: false